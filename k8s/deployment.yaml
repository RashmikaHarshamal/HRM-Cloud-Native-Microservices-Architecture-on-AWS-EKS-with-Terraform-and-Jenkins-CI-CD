apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrm-service
  namespace: hrm
  labels:
    app: hrm-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hrm-service
  template:
    metadata:
      labels:
        app: hrm-service
    spec:
      containers:
        - name: hrm-service
          image: hrm-service:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
