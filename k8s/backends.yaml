# __REGISTRY__ and __TAG__ are replaced at deploy time by
# scripts/deploy/deploy.ps1 (laptop) or the Jenkinsfile (CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: hrm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: app
          image: __REGISTRY__/hrm/user-service:__TAG__
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hrm-config
            - secretRef:
                name: hrm-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/hrm_db_user?sslmode=require"
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          # User has no Actuator, so only check that the port is open.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: hrm
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
