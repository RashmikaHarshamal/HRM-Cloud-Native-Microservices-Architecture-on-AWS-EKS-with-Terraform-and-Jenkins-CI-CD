# React app + API gateway. Same routing as the Caddyfile:
#   /user/*  -> user-service      /hr/*    -> hr-service
#   /employee/* -> employee-service  /admin/* -> admin-service
#   everything else -> React (index.html)
# Exposed to the internet by one AWS load balancer (Service type LoadBalancer).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: hrm
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 20m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Never expose service-to-service endpoints publicly.
        location ~ ^/[^/]+/api/(internal|sync)(/|$) { return 403; }
        location ~ ^/user/api/auth/(sync-all|debug-user) { return 403; }

        location /user/     { proxy_pass http://user-service:8080/; }
        location /hr/       { proxy_pass http://hr-service:8080/; }
        location /employee/ { proxy_pass http://employee-service:8080/; }
        location /admin/    { proxy_pass http://admin-service:8080/; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hrm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: app
          image: __REGISTRY__/hrm/frontend:__TAG__
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hrm
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
