# ============================================
# User Service (Legacy) — Application Configuration
# ============================================
# NOTE: This service is deprecated. New functionality should be
# added to the Employee Service or HR Service instead.
# ============================================

# ── .env file location (spring-dotenv reads this at root level) ──
env:
  directory: ../

spring:
  application:
    name: user-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${USER_DB_NAME:hrm_db_user}
    username: ${USER_DB_USERNAME:postgres}
    password: ${USER_DB_PASSWORD:newpassword123}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  sql:
    init:
      mode: always
      platform: postgres

server:
  port: ${USER_SERVICE_PORT:5004}

jwt:
  secret: ${JWT_SECRET:hrm-dev-secret-key-change-this-in-production-must-be-at-least-256-bits-long-for-hs256}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

logging:
  level:
    root: INFO
    com.affin.hrm: ${LOG_LEVEL:INFO}

# ── Inter-Service URLs ─────────────────────
service:
  employee-url: ${EMPLOYEE_SERVICE_URL:http://localhost:5006}
  hr-url: ${HR_SERVICE_URL:http://localhost:5005}
